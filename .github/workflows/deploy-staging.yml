name: Deploy staging

on:
  push:
    branches: [release-0.0.1]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SITE_ENV: ${{ vars.SITE_ENV }}

      - name: Check build output
        run: |
          ls out | head
          test -f out/404.html && echo "404.html found" || echo "WARNING: no 404.html"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload hashed assets (cache for a year)
        run: >
          aws s3 sync out/_next s3://${{ vars.S3_BUCKET }}/_next
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload pages and other files (always revalidate)
        run: >
          aws s3 sync out s3://${{ vars.S3_BUCKET }}
          --exclude "_next/*" --delete
          --cache-control "public,max-age=0,must-revalidate"

      - name: Clear CDN cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CF_DIST_ID }}
          --paths "/*"
